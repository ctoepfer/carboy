<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Library</title>
    <link rel="stylesheet" href="./shared/app.css" />
    <script type="module" src="./library.js"></script>
  </head>
  <body>
    <header id="header"></header>
    <main>
      <h1>Library</h1>
      <p class="note">Spike page: every revision in the local SQLite library, each re-verified against its content hash on open.</p>
      <dl id="health"></dl>
      <p id="summary" role="status">Opening library…</p>
      <table>
        <caption class="sr-only">Saved revisions and their verification result</caption>
        <thead><tr><th scope="col">Revision</th><th scope="col">Recipe</th><th scope="col">Verified</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </main>
  </body>
</html>

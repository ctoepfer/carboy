[package]
name = "spike-shell"
version = "0.0.0"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "Phase 1 throwaway spike: Tauri 2 shell running the track A Recipe Core"

[lib]
# Mobile (iOS/Android) builds link the app as a library.
name = "spike_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
tauri = { version = "=2.12.3", features = [] }
tauri-plugin-sql = { version = "=2.5.0", features = ["sqlite"] }
serde_json = "1"

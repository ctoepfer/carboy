# Phase 1 throwaway spike (spikes/phase1/SPIKE_PLAN.md, step 5).
# Manual trigger only: nothing runs, and no runner minutes are used (macOS
# minutes may cost money), until the owner starts it from the Actions tab.
name: phase1-spike

on:
  workflow_dispatch:
    inputs:
      only:
        description: "all, or mobile to run just the macOS shell (with iOS) and Android"
        type: choice
        options: [all, mobile]
        default: all
      recovery_rounds:
        description: "Rounds of the hard-kill recovery test (raise it to hunt the macOS hang)"
        type: number
        default: 3
      recovery_window:
        description: "hidden, or visible as the control for the macOS hang"
        type: choice
        options: [hidden, visible]
        default: hidden

permissions:
  contents: read

jobs:
  core-tests:
    if: inputs.only != 'mobile'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: spikes/phase1/recipe-core
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - run: npm ci
      - run: npm test

  shell:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.only == 'mobile' && '["macos-latest"]' || '["ubuntu-24.04", "windows-latest", "macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: spikes/phase1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: Linux system libraries (WebKitGTK 4.1, display server for the run)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libssl-dev build-essential xvfb
          # Scripted Orca run and AT-SPI tree check (isolated runner, no audio).
          sudo apt-get install -y orca at-spi2-core dbus-x11 xdotool python3-gi gir1.2-atspi-2.0 speech-dispatcher espeak-ng pulseaudio pulseaudio-utils
      - run: rustup show && cargo --version
      - run: (cd recipe-core && npm ci) && (cd graph && npm ci)
      - run: ./shell-tauri/prepare.sh
      - run: cargo build --manifest-path shell-tauri/src-tauri/Cargo.toml
      - name: Run the core checks, Recipe, Library, and platform probe pages (hidden window; axe-core on each)
        timeout-minutes: 6
        run: |
          exe=shell-tauri/src-tauri/target/debug/spike-shell
          [ -f "$exe.exe" ] && exe="$exe.exe"
          run() { if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a "$@"; else "$@"; fi; }
          for page in index recipe library probe; do
            SPIKE_HIDDEN=1 SPIKE_START=$page.html SPIKE_AUTO=1 SPIKE_EXIT=1 SPIKE_AXE=1 SPIKE_REPORT=$PWD/report-$page.json \
              run "$exe" || echo "::warning::$page run exited with $?"
            cat report-$page.json || echo "::error::no report for $page"
          done
      - name: Graph pages (visible window; animation frames don't run when hidden)
        timeout-minutes: 6
        run: |
          exe=shell-tauri/src-tauri/target/debug/spike-shell
          [ -f "$exe.exe" ] && exe="$exe.exe"
          run() { if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a "$@"; else "$@"; fi; }
          for g in graph-react graph-svelte; do
            SPIKE_START=$g/index.html SPIKE_AUTO=1 SPIKE_EXIT=1 SPIKE_AXE=1 SPIKE_REPORT=$PWD/report-$g.json \
              run "$exe" || echo "::warning::$g run exited with $?"
          done
          # Keyboard, selection, and axe with stages exposed as buttons (GRAPH_REPORT, role comparison).
          for g in graph-react graph-svelte; do
            SPIKE_STAGE_ROLE=button SPIKE_START=$g/index.html SPIKE_AUTO=1 SPIKE_EXIT=1 SPIKE_AXE=1 SPIKE_REPORT=$PWD/report-$g-button.json \
              run "$exe" || echo "::warning::$g button run exited with $?"
          done
      - name: Navigation test (Linux, clean virtual display; GRAPH_REPORT finding 3)
        if: runner.os == 'Linux'
        timeout-minutes: 4
        run: |
          exe=shell-tauri/src-tauri/target/debug/spike-shell
          # No SPIKE_EXIT: the checks page reports, then clicks the nav link; the
          # graph page's report replaces it. The run ends at the timeout.
          SPIKE_START=index.html SPIKE_AUTO=1 SPIKE_NAV="Process graph: React Flow" SPIKE_REPORT=$PWD/report-nav.json \
            timeout 90 xvfb-run -a "$exe" >nav.log 2>&1 || true  # xvfb-run sends the app's stderr to stdout
          python3 tools/nav_summary.py nav.log report-nav.json > report-nav-summary.json
          cat report-nav-summary.json
      - name: Scripted Orca run (Linux; supplements, never replaces, a person listening)
        if: runner.os == 'Linux'
        continue-on-error: true
        timeout-minutes: 12
        run: |
          exe=$PWD/shell-tauri/src-tauri/target/debug/spike-shell
          # One clean session per candidate; "default" is the library's role, group.
          session() {
            SPIKE_STAGE_ROLE=$2 ORCA_PAGE=$1/index.html xvfb-run -a dbus-run-session -- bash tools/orca_session.sh "$exe" "$PWD/orca-report/$1-${2:-default}" || true
          }
          session graph-react ""
          session graph-react button
          session graph-react listitem
          session graph-svelte button
          grep -c "Stage [0-9]" orca-report/*/speech.txt || true
      - name: Recipe Core under JavaScriptCore (macOS jsc or osascript; iOS engine family, no app shell)
        if: runner.os == 'macOS'
        continue-on-error: true
        timeout-minutes: 4
        working-directory: .
        run: |
          npm ci && npm run build --workspaces
          npx --yes esbuild@0.28.2 packages/recipe-core/dist/index.js --bundle --format=esm --outfile=spikes/phase1/jsc/core.mjs --log-level=warning
          # find, not ls: a missing candidate path must not abort the step (pipefail).
          jsc=$(find /System/Library/Frameworks/JavaScriptCore.framework -name jsc -type f 2>/dev/null | head -1)
          echo "jsc: ${jsc:-not found}"; sw_vers || true
          if [ -n "$jsc" ]; then
            "$jsc" -m spikes/phase1/jsc/check.mjs | tee spikes/phase1/report-jsc.json
          else
            # No jsc shell (removed in recent macOS): run the same checks on the
            # system JavaScriptCore through JavaScript for Automation.
            npx --yes esbuild@0.28.2 spikes/phase1/jsc/check-jxa.mjs --bundle --format=iife --outfile=jxa-check.js --log-level=warning
            printf '\n__carboyReport;\n' >> jxa-check.js
            osascript -l JavaScript jxa-check.js | tee spikes/phase1/report-jsc.json
          fi
      - name: SQLite recovery after hard kill during writes (ADR 0006; blocking)
        timeout-minutes: 45
        env:
          RECOVERY_WINDOW: ${{ inputs.recovery_window || 'hidden' }}
        run: |
          exe=$PWD/shell-tauri/src-tauri/target/debug/spike-shell
          [ -f "$exe.exe" ] && exe="$exe.exe"
          tools/kill_recovery.sh "$exe" "${{ inputs.recovery_rounds || 3 }}" 6 "$PWD/recovery-report"
      - name: Recipe Library through the shell, hard kill during saves (ADR 0006)
        if: ${{ !cancelled() }}
        timeout-minutes: 12
        env:
          RECOVERY_PAGE: repo.html
          RECOVERY_DB: repo.db
          RECOVERY_WINDOW: ${{ inputs.recovery_window || 'hidden' }}
        run: |
          exe=$PWD/shell-tauri/src-tauri/target/debug/spike-shell
          [ -f "$exe.exe" ] && exe="$exe.exe"
          tools/kill_recovery.sh "$exe" 3 6 "$PWD/repo-recovery-report"
      - name: iOS Simulator build of the shell (exploratory; Tauri 2 mobile)
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        continue-on-error: true
        timeout-minutes: 25
        working-directory: spikes/phase1/shell-tauri
        run: |
          rustup target add aarch64-apple-ios-sim
          xcodebuild -version || true
          npm ci --no-audit --no-fund
          npm run tauri -- ios init --ci 2>&1 | tail -40
          npm run tauri -- ios build --target aarch64-sim --debug --ci 2>&1 | grep -vE '^\s+export ' | tail -80
          find src-tauri/gen/apple -name '*.app' -maxdepth 6 2>/dev/null | head -5
      - name: Run the shell in the iOS Simulator (exploratory; a simulator, not a device)
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        continue-on-error: true
        timeout-minutes: 12
        working-directory: spikes/phase1/shell-tauri
        run: |
          # The archive step leaves symlinks with this name; only a real bundle installs.
          find src-tauri/gen/apple ~/Library/Developer/Xcode/DerivedData -type d -name 'spike-shell.app' 2>/dev/null | tee ../ios-candidates.txt
          app=$(while read -r c; do [ -f "$c/Info.plist" ] && { echo "$c"; break; }; done < ../ios-candidates.txt)
          echo "app: ${app:-none}"
          udid=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k in sorted(d, reverse=True) if 'iOS' in k for x in d[k] if 'iPhone' in x['name']))")
          echo "device: $udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl install "$udid" "$app"
          id=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")
          reports=$PWD/../ios-report; mkdir -p "$reports"
          # A simulated app is a host process, so it can write the report to a host path.
          for page in index recipe library repo graph-react/index graph-svelte/index; do
            name=$(echo "$page" | tr '/' '-')
            SIMCTL_CHILD_SPIKE_AUTO=1 SIMCTL_CHILD_SPIKE_START=$page.html SIMCTL_CHILD_SPIKE_REPORT="$reports/$name.json" \
              xcrun simctl launch --terminate-running-process "$udid" "$id" || echo "::warning::launch $page failed"
            for _ in $(seq 1 45); do [ -f "$reports/$name.json" ] && break; sleep 1; done
            xcrun simctl io "$udid" screenshot "$reports/$name.png" || true
            xcrun simctl terminate "$udid" "$id" || true
          done
          ls -la "$reports"
      - name: SQLite durability benchmark, FULL vs NORMAL under WAL, with and without fullfsync (ADR 0006)
        if: ${{ !cancelled() }}
        timeout-minutes: 4
        run: |
          py=python3; command -v python3 >/dev/null || py=python
          $py tools/sqlite_durability_bench.py --n 200 --out $PWD/report-sqlite-bench.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: spike-reports-${{ matrix.os }}
          path: |
            spikes/phase1/report-*.json
            spikes/phase1/orca-report/
            spikes/phase1/recovery-report/
            spikes/phase1/repo-recovery-report/
            spikes/phase1/ios-report/
          if-no-files-found: warn

  android:
    # Exploratory: does the shell build, install, and start on an Android
    # emulator? Scripted directly, because third-party emulator actions don't
    # pass the repository's Actions policy. An emulator is not a device.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    continue-on-error: true
    defaults:
      run:
        shell: bash
        working-directory: spikes/phase1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: Build the debug APK
        run: |
          export NDK_HOME=$ANDROID_NDK_LATEST_HOME JAVA_HOME=$JAVA_HOME_17_X64
          rustup target add x86_64-linux-android
          (cd recipe-core && npm ci) && (cd graph && npm ci)
          ./shell-tauri/prepare.sh
          cd shell-tauri
          npm ci --no-audit --no-fund
          npm run tauri -- android init --ci 2>&1 | tail -20
          npm run tauri -- android build --debug --apk --target x86_64 --ci 2>&1 | tail -40
          find src-tauri/gen/android -name '*.apk' | head
      - name: Install and start on an emulator
        run: |
          mkdir -p android-report
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          sdk=$ANDROID_HOME/cmdline-tools/latest/bin
          export JAVA_HOME=$JAVA_HOME_17_X64 PATH=$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH
          # avdmanager and the emulator otherwise look in different places.
          export ANDROID_USER_HOME=$HOME/.android ANDROID_AVD_HOME=$HOME/.android/avd
          mkdir -p "$ANDROID_AVD_HOME"
          yes | "$sdk/sdkmanager" --licenses >/dev/null || true
          "$sdk/sdkmanager" "system-images;android-34;google_apis;x86_64" "emulator" "platform-tools" >/dev/null
          echo no | "$sdk/avdmanager" create avd -n spike -k "system-images;android-34;google_apis;x86_64" --force
          nohup emulator -avd spike -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect >android-report/emulator.log 2>&1 &
          timeout 300 adb wait-for-device || { tail -20 android-report/emulator.log; exit 1; }
          for _ in $(seq 1 120); do [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1 ] && break; sleep 3; done
          apk=$(find shell-tauri/src-tauri/gen/android -name '*.apk' | head -1)
          adb install -r "$apk"
          adb shell monkey -p invalid.spike.phase1_shell -c android.intent.category.LAUNCHER 1 || adb shell monkey -p invalid.spike.phase1shell -c android.intent.category.LAUNCHER 1 || true
          sleep 40
          adb shell pidof invalid.spike.phase1_shell | tee android-report/pid.txt || true
          adb exec-out screencap -p > android-report/screen.png || true
          adb logcat -d > android-report/logcat.txt || true
          adb shell pm list packages | grep -i spike | tee android-report/packages.txt || true
          adb shell dumpsys webviewupdate | grep -iE 'current webview|version' | head -5 | tee android-report/webview.txt || true
          grep -iE 'chromium|rust|panic|fatal|spike' android-report/logcat.txt | tail -40 || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: spike-reports-android
          path: spikes/phase1/android-report/
          if-no-files-found: warn
